# Applied on top of application.yaml by @IntegrationTest and @E2ETest.
spring:
  ai:
    deepseek:
      # The tests never call DeepSeek, but the application needs a key to start.
      api-key: unused

unnamed:
  security:
    jwt:
      # Overridden by JwksExtension with the URL of a local JWKS server
      jwk-set-uri: http://localhost/unused-jwks.json
      audience: core-api
      issuer: ""
      organization-claim: organization
  cors:
    allowed-origins: http://localhost:5173
  tuition-payments:
    monthly-job:
      # "-" turns the schedule off: the tests run the job themselves.
      cron: "-"

management:
  opentelemetry:
    map-environment-variables: false
  otlp:
    metrics:
      export:
        enabled: false

logging:
  # Plain text instead of JSON, easier to read in the test output.
  structured:
    format:
      console: ""
      file: ""
