# Production. The database is external: point JDBC_URL at it.
# docker compose pull && docker compose up -d
# No port is published on the host: Traefik, in the external network traefik_net, forwards the connections to the
# containers (core-api on 8080, dashboard on 80) and terminates the TLS.
name: unnamed

networks:
  traefik_net:
    name: traefik_net
    external: true
  postgres_net:
    name: postgres_net
    external: true

services:
  core-api:
    image: ${REGISTRY:?Define REGISTRY}/unnamed/core-api
    restart: unless-stopped
    environment:
      JDBC_URL: ${JDBC_URL:?Define JDBC_URL}
      DB_USERNAME: ${DB_USERNAME:?Define DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:?Define JWT_JWK_SET_URI}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Define JWT_AUDIENCE}
      JWT_ISSUER: ${JWT_ISSUER:?Define JWT_ISSUER}
      JWT_ORGANIZATION_CLAIM: ${JWT_ORGANIZATION_CLAIM:?Define JWT_ORGANIZATION_CLAIM}
      AI_API_KEY: ${AI_API_KEY:?Define AI_API_KEY}
    networks:
      - traefik_net
      - postgres_net

  dashboard:
    image: ${REGISTRY:?Define REGISTRY}/unnamed/dashboard
    restart: unless-stopped
    networks:
      - traefik_net
